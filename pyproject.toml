[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hopsa"
dynamic = ["version"]
description = "Utilities that I use frequently"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Hopsakee", email = "jdejong@posteo.nl"}]
keywords = ['nbdev', 'jupyter', 'notebook', 'python']
classifiers = ["Natural Language :: English", "Intended Audience :: Developers", "Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only"]
dependencies = []

[project.urls]
Repository = "https://github.com/Hopsakee/hopsa"
Documentation = "https://Hopsakee.github.io/hopsa"

[project.entry-points.nbdev]
hopsa = "hopsa._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "hopsa.__version__"}

[tool.setuptools.packages.find]
include = ["hopsa"]

[tool.nbdev]
